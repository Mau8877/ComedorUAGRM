name: CI

# Corre en cada PR contra main y en cada push directo a main (ej. un merge).
# No hay job de deploy acá -- ver .claude/rules/CI_CD.md para por qué CD
# todavía no está definido para este proyecto.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, Mauro]

jobs:
  # Detecta qué carpetas cambiaron para no correr, por ejemplo, todo el
  # pipeline de Flutter cuando el cambio solo tocó el backend core -- ver
  # .claude/rules/CI_CD.md#un-job-por-proyecto-no-uno-solo-para-todo.
  changes:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      ia: ${{ steps.filter.outputs.ia }}
      frontend: ${{ steps.filter.outputs.frontend }}
      landing: ${{ steps.filter.outputs.landing }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'projects/backend/comedor-uagrm-core/**'
            ia:
              - 'projects/backend/comedor-uagrm-ia/**'
            frontend:
              - 'projects/frontend/comedoruagrm/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            landing:
              - 'projects/frontend/nexware-landing/**'
            mobile:
              - 'projects/mobile/**'

  # Backend core (Spring Boot): projects/backend/comedor-uagrm-core.
  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/backend/comedor-uagrm-core
    # ComedorUagrmBackendApplicationTests/SecurityConfigTest usan @SpringBootTest
    # (contexto completo), y Flyway/JPA necesitan una conexión real al arrancar
    # -- el datasource por defecto de application.properties apunta a
    # localhost:5432/comedor_uagrm_db (mismas credenciales que docker-compose
    # en local). Estos services levantan Postgres y Redis efímeros en el
    # runner, mapeados al mismo host:puerto que ese default, para que el
    # contexto arranque igual que en local sin tener que tocar el código de
    # la app ni de los tests.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comedor_uagrm_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # El runner de Ubuntu trae Docker nativo (a diferencia del socket
      # restringido de Docker Desktop en Windows, ver TESTING_BACKEND.md),
      # así que los tests con Testcontainers corren de verdad acá en vez
      # de quedar SKIPPED como en el setup local de Windows.
      - name: Dar permiso de ejecución a mvnw
        run: chmod +x ./mvnw
      - name: Checkstyle
        run: ./mvnw -B checkstyle:check
      # `mvn test` también genera el reporte de cobertura de JaCoCo (pom.xml).
      - name: Tests
        run: ./mvnw -B test
      - name: Subir cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend-jacoco
          path: projects/backend/comedor-uagrm-core/target/site/jacoco
          if-no-files-found: warn
      - name: Subir resultados de pruebas (surefire)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-backend-surefire
          path: projects/backend/comedor-uagrm-core/target/surefire-reports
          if-no-files-found: warn
      - name: Build
        run: ./mvnw -B clean package -DskipTests

  # Backend IA (FastAPI): projects/backend/comedor-uagrm-ia.
  ia:
    needs: changes
    if: needs.changes.outputs.ia == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/backend/comedor-uagrm-ia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: projects/backend/comedor-uagrm-ia/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # El lockfile vive en la raíz del workspace pnpm, no dentro de
      # projects/frontend/comedoruagrm -- ver docs/README.md. nexware-landing
      # usa npm por separado y tiene su propio job (`landing`, abajo).
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir projects/frontend/comedoruagrm run lint
      - run: pnpm --dir projects/frontend/comedoruagrm exec vitest run --coverage
      - name: Subir cobertura Vitest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-web-vitest
          path: projects/frontend/comedoruagrm/coverage
          if-no-files-found: warn
      - run: pnpm --dir projects/frontend/comedoruagrm run build

  # Landing de Nexware (Astro): fuera del workspace pnpm, con npm propio.
  landing:
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/frontend/nexware-landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Astro 7 exige Node >= 22.23.4 (la imagen node:22 vieja de Docker
          # fallaba por eso); 22 resuelve siempre al último parche.
          node-version: 22
          cache: npm
          cache-dependency-path: projects/frontend/nexware-landing/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:i18n
      - run: npm test
      - run: npm run build

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/mobile
    steps:
      - uses: actions/checkout@v4
      # Versión fijada a la que se usa en local: `stable` pasó a Flutter 3.47+,
      # donde `package:flutter/material.dart` está deprecado en favor de
      # `package:material_ui` (que exige Flutter >= 3.47). Se migra a
      # material_ui cuando se suba Flutter también en local.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
      - run: flutter pub get
      # pubspec.yaml declara `.env` como asset (ver CONSUMO_API_MOBILE.md) --
      # el archivo real no se commitea (.gitignore), así que sin este paso
      # `flutter analyze` falla con "asset_does_not_exist" en un checkout
      # limpio como el de CI. Mismo criterio que backend/frontend: se arma
      # a partir de `.env.example`, con valores dummy que alcanzan para que
      # el análisis/los tests corran (no pegan contra un backend real).
      - run: cp .env.example .env
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Subir cobertura Flutter
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-movil-flutter
          path: projects/mobile/coverage
          if-no-files-found: warn

  # Pruebas de API (Bruno) y E2E (Playwright): levantan el backend en perfil dev
  # (con datos de prueba) sobre un Postgres efímero. Corren si cambia backend o web.
  pruebas-sistema:
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: comedor_uagrm_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_PROFILES_ACTIVE: dev
      JWT_SECRET: ci-secreto-de-prueba-con-mas-de-32-caracteres
      RATE_LIMIT_CAPACITY: '100000'
      RATE_LIMIT_REFILL_PER_MINUTE: '100000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # MinIO con las credenciales y el bucket por defecto de application.properties:
      # lo usan generar acta, generar planilla y los cotejos (requests con tag `minio`).
      - name: Levantar MinIO
        run: |
          docker run -d --name minio --network host -e MINIO_ROOT_USER=minio_admin -e MINIO_ROOT_PASSWORD=minio_local_pass_123 quay.io/minio/minio server /data
          for i in $(seq 1 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 2; done
          docker run --rm --network host --entrypoint sh quay.io/minio/mc -c "mc alias set l http://localhost:9000 minio_admin minio_local_pass_123 && mc mb --ignore-existing l/comedor-uagrm-storage"
      - name: Levantar el backend
        working-directory: projects/backend/comedor-uagrm-core
        run: |
          chmod +x ./mvnw
          ./mvnw -B -q package -DskipTests
          nohup java -jar target/*.jar > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/health && break; sleep 3; done
      - name: Pruebas de API (Bruno)
        run: |
          npm install -g @usebruno/cli@4.3.0
          cd tests/api-bruno
          bru run --env local --reporter-html "$GITHUB_WORKSPACE/bruno-reporte.html" --reporter-junit "$GITHUB_WORKSPACE/bruno-junit.xml"
      - name: Levantar el panel web
        run: |
          cp projects/frontend/comedoruagrm/.env.example projects/frontend/comedoruagrm/.env
          pnpm --dir projects/frontend/comedoruagrm run build
          nohup pnpm --dir projects/frontend/comedoruagrm exec vite preview --host localhost --port 5173 > web.log 2>&1 &
          for i in $(seq 1 20); do curl -sf http://localhost:5173 && break; sleep 1; done
      - name: E2E (Playwright)
        working-directory: tests/e2e
        env:
          WEB_URL: http://localhost:5173
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
          npx --no-install playwright test
      - name: Subir evidencia de sistema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-bruno-playwright
          path: |
            bruno-reporte.html
            bruno-junit.xml
            tests/e2e/playwright-report
            tests/e2e/capturas
            backend.log
          if-no-files-found: ignore
