worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 127.0.0.11 es el DNS embebido de Docker dentro de la red del compose.
    # Con esto + `set $var ...` + `proxy_pass $var` (en vez de un bloque
    # `upstream {}` con el hostname fijo), nginx resuelve cada backend en
    # tiempo de REQUEST, no al arrancar. Antes, si `comedor-uagrm-frontend`
    # o `comedor-uagrm-backend` no estaban levantados en el instante exacto
    # en que nginx arrancaba, fallaba con "host not found in upstream" y
    # el proceso moría por completo (sin reintentar solo) -- justo lo que
    # pasó tras un reinicio de Docker Desktop en medio de esta sesión. Con
    # resolución dinámica, nginx arranca igual y devuelve 502 hasta que el
    # contenedor de destino esté disponible, sin necesitar reinicio manual.
    resolver 127.0.0.11 valid=10s;

    server {
        # Escuchamos en el puerto 80 estándar
        listen 80;
        server_name localhost;

        # 1. Regla para el Backend: Todo lo que empiece con /api/ va a Spring Boot
        location /api/ {
            set $backend_upstream http://comedor-uagrm-backend:8080;
            proxy_pass $backend_upstream;

            # Pasamos las cabeceras originales para que Spring Boot sepa la IP real del cliente
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Regla para la landing de Nexware (Astro): /landing-page/*.
        # Sin barra al final en el valor de $landing_upstream -- así nginx
        # reenvía la URI original completa, CON el prefijo /landing-page/
        # incluido (no lo recorta). Astro está configurado con
        # `base: '/landing-page'` (ver nexware-landing/astro.config.mjs)
        # precisamente para que sus propios links/assets ya incluyan ese
        # prefijo y coincidan con lo que nginx reenvía.
        location /landing-page/ {
            set $landing_upstream http://comedor-uagrm-nexware-landing:4321;
            proxy_pass $landing_upstream;
            proxy_set_header Host $host;

            # Soporte para el dev server de Astro (HMR vía WebSockets)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # 3. Regla para el Frontend: Cualquier otra ruta va a React (Vite),
        # es decir, ComedorUAGRM -- el panel actual.
        location / {
            set $frontend_upstream http://comedor-uagrm-frontend:5173;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;

            # 4. Soporte OBLIGATORIO para WebSockets (Vite HMR)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}