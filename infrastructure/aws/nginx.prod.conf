worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # DNS interno de Docker + `set $var`: nginx resuelve cada destino en cada request, no al arrancar
    # (mismo criterio que infrastructure/nginx/nginx.conf de desarrollo).
    resolver 127.0.0.11 valid=10s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Los documentos de las postulaciones pesan hasta 5 MB (8 MB de multipart): el default de nginx es 1 MB.
    client_max_body_size 10m;

    server {
        listen 80;
        server_name _;

        # Balanceador de CloudFront / chequeos: responde sin pasar por la app.
        location = /nginx-health {
            access_log off;
            return 200 'ok';
        }

        location /api/ {
            set $core http://core:8080;
            proxy_pass $core;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # CloudFront termina el HTTPS: hacia atrás todo viaja por HTTP, pero el cliente entró por HTTPS.
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 90s;
        }

        location /landing-page/ {
            set $landing http://landing:80;
            proxy_pass $landing;
            proxy_set_header Host $host;
        }

        location / {
            set $panel http://panel:80;
            proxy_pass $panel;
            proxy_set_header Host $host;
        }
    }
}
