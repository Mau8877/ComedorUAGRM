spring.application.name=comedor-uagrm-backend

# ==========================================
# 0. ACTUATOR (Health check)
# ==========================================
# Servimos los endpoints de Actuator directo en la raíz para que el health
# check quede en /health en vez de /actuator/health (útil para Docker/K8s).
management.endpoints.web.base-path=/
management.endpoint.health.show-details=always
# Sumamos "prometheus" a los endpoints expuestos (por defecto solo viene "health")
# para que Prometheus pueda scrapear métricas en /prometheus.
management.endpoints.web.exposure.include=health,prometheus
management.prometheus.metrics.export.enabled=true

# ==========================================
# 0.1 CORS (Frontend)
# ==========================================
# Orígenes permitidos para llamar a la API desde el navegador.
# - localhost:5173 -> Vite en modo dev (docker-compose)
# - localhost -> el frontend servido a través del proxy nginx (puerto 80)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}

# ==========================================
# 1. BASE DE DATOS (PostgreSQL)
# ==========================================
# Sintaxis: ${VARIABLE_DE_ENTORNO:valor_por_defecto_si_no_existe}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/comedor_uagrm_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 2. JPA / HIBERNATE
# ==========================================
# CRÍTICO: 'validate' verifica que la BD coincida con tus Entities, pero NO modifica la BD.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Muestra el SQL en consola formateado (solo recomendado en perfiles dev)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# 3. FLYWAY (Migraciones Controladas)
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Evita errores si la base de datos ya tenía tablas previas creadas manualmente
spring.flyway.baseline-on-migrate=true

# ==========================================
# 4. CACHÉ (Redis)
# ==========================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379

# ==========================================
# 5. ALMACENAMIENTO (MinIO - Propiedades Custom)
# ==========================================
# Spring no soporta MinIO nativamente, creamos nuestro propio namespace 'app.minio'
app.minio.url=${MINIO_URL:http://localhost:9000}
app.minio.access-key=${MINIO_ROOT_USER:minio_admin}
app.minio.secret-key=${MINIO_ROOT_PASSWORD:minio_local_pass_123}
app.minio.bucket-name=comedor-uagrm-storage