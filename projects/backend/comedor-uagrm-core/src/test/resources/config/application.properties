# Se suma a src/main/resources/application.properties solo en los tests: el
# secreto del JWT es obligatorio para que arranque el contexto.
app.jwt.secret=secreto-de-pruebas-solo-para-tests-0123456789

# Cada contexto de Spring distinto que cachean los tests abre su propio pool de
# conexiones y lo mantiene hasta el final de la JVM. Con el pool por defecto (10)
# y una docena de contextos se supera el max_connections de Postgres (100) y los
# contextos siguientes fallan con "too many clients". Un pool chico alcanza para
# los tests (el de concurrencia necesita 2 a 3 conexiones a la vez).
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
