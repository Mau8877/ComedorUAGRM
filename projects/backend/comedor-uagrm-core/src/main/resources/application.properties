spring.application.name=comedor-uagrm-backend

# ==========================================
# 0. ACTUATOR (Health check)
# ==========================================
# Servimos los endpoints de Actuator directo en la raíz para que el health
# check quede en /health en vez de /actuator/health (útil para Docker/K8s).
management.endpoints.web.base-path=/
management.endpoint.health.show-details=always
# Sumamos "prometheus" a los endpoints expuestos (por defecto solo viene "health")
# para que Prometheus pueda scrapear métricas en /prometheus.
management.endpoints.web.exposure.include=health,prometheus
management.prometheus.metrics.export.enabled=true

# ==========================================
# 0.1 CORS (Frontend)
# ==========================================
# Orígenes permitidos para llamar a la API desde el navegador.
# - localhost:5173 -> Vite en modo dev (docker-compose)
# - localhost -> el frontend servido a través del proxy nginx (puerto 80)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}

# ==========================================
# 0.2 RATE LIMIT (anti-abuso, por IP)
# ==========================================
# Aplica solo a /api/v1/** (ver RateLimitFilter) -- no a /health, /prometheus
# ni /swagger-ui/**, que reciben tráfico interno constante (ej. Prometheus
# scrapeando cada 5s, ver infrastructure/prometheus/prometheus.yml).
app.ratelimit.capacity=${RATE_LIMIT_CAPACITY:100}
app.ratelimit.refill-per-minute=${RATE_LIMIT_REFILL_PER_MINUTE:100}

# ==========================================
# 0.3 AUTENTICACIÓN (JWT propio)
# ==========================================
# Secreto con el que se firma el token de acceso (HS256). Obligatorio y de al menos
# 32 caracteres: si falta o es corto, el arranque falla (ver AutenticacionConfig).
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:comedor-uagrm}
# Vida del token de acceso (corta) y del refresh token (la sesión de un dispositivo).
app.jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:15}
app.jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:7}
# Cookies de sesión del cliente web (HttpOnly, SameSite=Strict). Secure = solo por HTTPS:
# false en desarrollo local (http), true en producción (ver AuthCookies).
app.cookies.secure=${COOKIE_SECURE:false}

# ==========================================
# 0.4 CORREO (SMTP) Y RECUPERACIÓN DE CONTRASEÑA
# ==========================================
# En desarrollo el correo cae en Mailpit (docker-compose, bandeja en http://localhost:8025).
# Para un proveedor real solo se cambian estas variables de entorno (no hay código que tocar).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
# Tiempos de espera para que un SMTP caído no deje colgado el hilo de envío
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Un SMTP caído no debe marcar la API como caída (/health en 503): el fallo de envío se
# tolera y se registra (CU15, A9), así que el chequeo de salud del correo se desactiva.
management.health.mail.enabled=false

# ==========================================
# 0.5 NOTIFICACIONES PUSH (Firebase Cloud Messaging) -- CU-EXTRA-01
# ==========================================
# Ruta a la cuenta de servicio de Firebase (JSON, secreta, no se versiona). Vacía o
# inexistente: el backend arranca igual y el push solo se escribe en el log.
app.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
# Canal de notificaciones de Android (el mismo que crea la app móvil)
app.notificaciones.android-channel-id=${NOTIFICACIONES_CANAL_ANDROID:notificaciones}
# Reintentos de un envío (push o correo): intentos totales y esperas entre ellos (ms)
app.notificaciones.reintentos=${NOTIFICACIONES_REINTENTOS:3}
app.notificaciones.esperas-ms=${NOTIFICACIONES_ESPERAS_MS:2000,8000}
# Remitente de los correos
app.mail.from=${MAIL_FROM:no-responder@comedoru.local}
# URL base del portal web: el enlace del correo abre {base-url}/restablecer-contrasena?token=...
app.web.base-url=${FRONTEND_URL:http://localhost}
# Vigencia del enlace de restablecimiento de contraseña (minutos)
app.auth.reset-ttl-minutes=${RESET_TTL_MINUTES:60}

# ==========================================
# 1. BASE DE DATOS (PostgreSQL)
# ==========================================
# Sintaxis: ${VARIABLE_DE_ENTORNO:valor_por_defecto_si_no_existe}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/comedor_uagrm_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 2. JPA / HIBERNATE
# ==========================================
# CRÍTICO: 'validate' verifica que la BD coincida con tus Entities, pero NO modifica la BD.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Muestra el SQL en consola formateado (solo recomendado en perfiles dev)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# 3. FLYWAY (Migraciones Controladas)
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Evita errores si la base de datos ya tenía tablas previas creadas manualmente
spring.flyway.baseline-on-migrate=true

# ==========================================
# 4. CACHÉ (Redis)
# ==========================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379

# ==========================================
# 5. ALMACENAMIENTO (MinIO - Propiedades Custom)
# ==========================================
# Spring no soporta MinIO nativamente, creamos nuestro propio namespace 'app.minio'
app.minio.url=${MINIO_URL:http://localhost:9000}
app.minio.access-key=${MINIO_ROOT_USER:minio_admin}
app.minio.secret-key=${MINIO_ROOT_PASSWORD:minio_local_pass_123}
app.minio.bucket-name=${STORAGE_BUCKET:comedor-uagrm-storage}
# Direccion con la que el NAVEGADOR llega a MinIO. Los documentos se abren con una URL temporal firmada con
# este host (no con `app.minio.url`, que dentro de Docker es http://comedor-uagrm-minio:9000 y el navegador no ve).
# En AWS S3 no hay dos direcciones: si MINIO_PUBLIC_URL no esta, usa la misma de `app.minio.url`.
app.minio.public-url=${MINIO_PUBLIC_URL:${MINIO_URL:http://localhost:9000}}
# Region del bucket. En MinIO local da igual (us-east-1); en AWS S3 tiene que ser la real (ej. sa-east-1).
app.minio.region=${MINIO_REGION:us-east-1}
# Como se autentica el backend ante el almacenamiento: `static` (MINIO_ROOT_USER y MINIO_ROOT_PASSWORD, para
# MinIO) o `aws-iam` (el rol de la maquina o del contenedor, o las variables AWS_*; sin claves guardadas, para S3).
# Pasar a produccion en AWS: MINIO_URL=https://s3.<region>.amazonaws.com, MINIO_REGION=<region>,
# STORAGE_CREDENTIALS=aws-iam y STORAGE_BUCKET=<bucket>. Ver docs/ALMACENAMIENTO_S3.md.
app.minio.credentials=${STORAGE_CREDENTIALS:static}
# Documentos de la postulacion (CU16). Formatos, tamaño y cantidad: por definir con la DUBSS (estos son valores
# iniciales). El tamaño va en bytes; los formatos se comprueban por el CONTENIDO del archivo, no por su extension.
app.documentos.tamano-maximo-bytes=${DOCUMENTOS_TAMANO_MAXIMO_BYTES:5242880}
app.documentos.formatos-permitidos=${DOCUMENTOS_FORMATOS_PERMITIDOS:application/pdf,image/jpeg,image/png}
app.documentos.maximo-archivos-por-tipo=${DOCUMENTOS_MAXIMO_ARCHIVOS_POR_TIPO:5}
# Limite de Spring para la subida: un poco mayor que el del documento, para que el rechazo normal lo haga el
# servicio con su mensaje y este corte solo ataje lo desmedido.
spring.servlet.multipart.max-file-size=${DOCUMENTOS_MULTIPART_MAXIMO:8MB}
spring.servlet.multipart.max-request-size=${DOCUMENTOS_MULTIPART_MAXIMO:8MB}
# Dashboard de indicadores BI (CU12): cuando se refresca por lote la vista mv_indicadores_convocatoria (formato de
# Spring, segundos primero; zona America/La_Paz). Por defecto, cada noche a las 02:00.
app.dashboard.refresco-cron=${DASHBOARD_REFRESCO_CRON:0 0 2 * * *}
# Convocatorias (CU13): cada cuanto se cierran solas las convocatorias abiertas cuya fecha de cierre ya paso (formato de
# Spring, segundos primero; zona America/La_Paz). Por defecto, cada 5 minutos.
app.convocatorias.cierre-cron=${CONVOCATORIAS_CIERRE_CRON:0 */5 * * * *}
# --- Datos de desarrollo (solo con el perfil `dev`; nunca en produccion) ---
# Cuenta inicial de Administrador DUBSS (DatosInicialesAdmin). Se crea una sola vez; no pisa una contraseña cambiada.
app.seed.admin.enabled=${SEED_ADMIN_ENABLED:true}
app.seed.admin.correo=${SEED_ADMIN_CORREO:admin@dubss.com}
app.seed.admin.contrasena=${SEED_ADMIN_CONTRASENA:123123123}
app.seed.admin.ci=${SEED_ADMIN_CI:0000001}
# Convocatorias, postulantes, postulaciones y puntajes de prueba para la lista priorizada (DatosPruebaListaPriorizada).
# `postulaciones` fija cuantos postulantes se crean (60 para ver la pantalla; 20000 para medir el rendimiento).
app.seed.priorizacion.enabled=${SEED_PRIORIZACION_ENABLED:true}
app.seed.priorizacion.postulaciones=${SEED_PRIORIZACION_POSTULACIONES:60}
# Finalistas, avisos y comunicado de ejemplo para el CU21 (DatosPruebaFinalistas). Habilita el inicio de sesion
# de un finalista de prueba (postulante.finalista@prueba.local); la contrasena es de prueba y solo vive en dev.
app.seed.finalistas.enabled=${SEED_FINALISTAS_ENABLED:true}
app.seed.finalistas.contrasena=${SEED_FINALISTAS_CONTRASENA:123123123}
app.seed.expedientes.enabled=${SEED_EXPEDIENTES_ENABLED:true}
app.seed.adjudicacion.enabled=${SEED_ADJUDICACION_ENABLED:true}
# Directivo de prueba (directivo@dubss.com) y datos del dashboard de indicadores CU12 (DatosPruebaDashboard).
app.seed.dashboard.enabled=${SEED_DASHBOARD_ENABLED:true}
app.seed.dashboard.contrasena=${SEED_DASHBOARD_CONTRASENA:123123123}
# Datos de volumen (B1): respuestas, adjudicados, becas y asistencias sobre los postulantes de prueba. El volumen
# lo fija app.seed.priorizacion.postulaciones (20000 para medir rendimiento).
app.seed.volumen.enabled=${SEED_VOLUMEN_ENABLED:true}
app.seed.volumen.dias=${SEED_VOLUMEN_DIAS:35}
# Modulo de IA (comedor-uagrm-ia, puntaje de vulnerabilidad: CU02/CU03). Direccion, tiempo de espera de cada calculo
# (segundos; el individual debe completarse en 5) y cada cuanto se reintentan las postulaciones que siguen
# `pendiente` porque la IA no respondio (formato de Spring, segundos primero; zona America/La_Paz). Cada 5 minutos.
app.ia.base-url=${IA_BASE_URL:http://localhost:8000}
app.ia.timeout-segundos=${IA_TIMEOUT_SEGUNDOS:5}
app.ia.reintento-cron=${IA_REINTENTO_CRON:0 */5 * * * *}
