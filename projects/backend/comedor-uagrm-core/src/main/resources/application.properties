spring.application.name=comedor-uagrm-backend

# ==========================================
# 0. ACTUATOR (Health check)
# ==========================================
# Servimos los endpoints de Actuator directo en la raíz para que el health
# check quede en /health en vez de /actuator/health (útil para Docker/K8s).
management.endpoints.web.base-path=/
management.endpoint.health.show-details=always
# Sumamos "prometheus" a los endpoints expuestos (por defecto solo viene "health")
# para que Prometheus pueda scrapear métricas en /prometheus.
management.endpoints.web.exposure.include=health,prometheus
management.prometheus.metrics.export.enabled=true

# ==========================================
# 0.1 CORS (Frontend)
# ==========================================
# Orígenes permitidos para llamar a la API desde el navegador.
# - localhost:5173 -> Vite en modo dev (docker-compose)
# - localhost -> el frontend servido a través del proxy nginx (puerto 80)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}

# ==========================================
# 0.2 RATE LIMIT (anti-abuso, por IP)
# ==========================================
# Aplica solo a /api/v1/** (ver RateLimitFilter) -- no a /health, /prometheus
# ni /swagger-ui/**, que reciben tráfico interno constante (ej. Prometheus
# scrapeando cada 5s, ver infrastructure/prometheus/prometheus.yml).
app.ratelimit.capacity=${RATE_LIMIT_CAPACITY:100}
app.ratelimit.refill-per-minute=${RATE_LIMIT_REFILL_PER_MINUTE:100}

# ==========================================
# 0.3 AUTENTICACIÓN (JWT propio)
# ==========================================
# Secreto con el que se firma el token de acceso (HS256). Obligatorio y de al menos
# 32 caracteres: si falta o es corto, el arranque falla (ver AutenticacionConfig).
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=${JWT_ISSUER:comedor-uagrm}
# Vida del token de acceso (corta) y del refresh token (la sesión de un dispositivo).
app.jwt.access-ttl-minutes=${JWT_ACCESS_TTL_MINUTES:15}
app.jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:7}
# Cookies de sesión del cliente web (HttpOnly, SameSite=Strict). Secure = solo por HTTPS:
# false en desarrollo local (http), true en producción (ver AuthCookies).
app.cookies.secure=${COOKIE_SECURE:false}

# ==========================================
# 0.4 CORREO (SMTP) Y RECUPERACIÓN DE CONTRASEÑA
# ==========================================
# En desarrollo el correo cae en Mailpit (docker-compose, bandeja en http://localhost:8025).
# Para un proveedor real solo se cambian estas variables de entorno (no hay código que tocar).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
# Tiempos de espera para que un SMTP caído no deje colgado el hilo de envío
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Un SMTP caído no debe marcar la API como caída (/health en 503): el fallo de envío se
# tolera y se registra (CU15, A9), así que el chequeo de salud del correo se desactiva.
management.health.mail.enabled=false

# ==========================================
# 0.5 NOTIFICACIONES PUSH (Firebase Cloud Messaging) -- CU-EXTRA-01
# ==========================================
# Ruta a la cuenta de servicio de Firebase (JSON, secreta, no se versiona). Vacía o
# inexistente: el backend arranca igual y el push solo se escribe en el log.
app.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
# Canal de notificaciones de Android (el mismo que crea la app móvil)
app.notificaciones.android-channel-id=${NOTIFICACIONES_CANAL_ANDROID:notificaciones}
# Reintentos de un envío (push o correo): intentos totales y esperas entre ellos (ms)
app.notificaciones.reintentos=${NOTIFICACIONES_REINTENTOS:3}
app.notificaciones.esperas-ms=${NOTIFICACIONES_ESPERAS_MS:2000,8000}
# Remitente de los correos
app.mail.from=${MAIL_FROM:no-responder@comedoru.local}
# URL base del portal web: el enlace del correo abre {base-url}/restablecer-contrasena?token=...
app.web.base-url=${FRONTEND_URL:http://localhost}
# Vigencia del enlace de restablecimiento de contraseña (minutos)
app.auth.reset-ttl-minutes=${RESET_TTL_MINUTES:60}

# ==========================================
# 1. BASE DE DATOS (PostgreSQL)
# ==========================================
# Sintaxis: ${VARIABLE_DE_ENTORNO:valor_por_defecto_si_no_existe}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/comedor_uagrm_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 2. JPA / HIBERNATE
# ==========================================
# CRÍTICO: 'validate' verifica que la BD coincida con tus Entities, pero NO modifica la BD.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Muestra el SQL en consola formateado (solo recomendado en perfiles dev)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# 3. FLYWAY (Migraciones Controladas)
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Evita errores si la base de datos ya tenía tablas previas creadas manualmente
spring.flyway.baseline-on-migrate=true

# ==========================================
# 4. CACHÉ (Redis)
# ==========================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379

# ==========================================
# 5. ALMACENAMIENTO (MinIO - Propiedades Custom)
# ==========================================
# Spring no soporta MinIO nativamente, creamos nuestro propio namespace 'app.minio'
app.minio.url=${MINIO_URL:http://localhost:9000}
app.minio.access-key=${MINIO_ROOT_USER:minio_admin}
app.minio.secret-key=${MINIO_ROOT_PASSWORD:minio_local_pass_123}
app.minio.bucket-name=comedor-uagrm-storage
# --- Datos de desarrollo (solo con el perfil `dev`; nunca en produccion) ---
# Cuenta inicial de Administrador DUBSS (DatosInicialesAdmin). Se crea una sola vez; no pisa una contraseña cambiada.
app.seed.admin.enabled=${SEED_ADMIN_ENABLED:true}
app.seed.admin.correo=${SEED_ADMIN_CORREO:admin@dubss.com}
app.seed.admin.contrasena=${SEED_ADMIN_CONTRASENA:123123123}
app.seed.admin.ci=${SEED_ADMIN_CI:0000001}
# Convocatorias, postulantes, postulaciones y puntajes de prueba para la lista priorizada (DatosPruebaListaPriorizada).
# `postulaciones` fija cuantos postulantes se crean (60 para ver la pantalla; 20000 para medir el rendimiento).
app.seed.priorizacion.enabled=${SEED_PRIORIZACION_ENABLED:true}
app.seed.priorizacion.postulaciones=${SEED_PRIORIZACION_POSTULACIONES:60}
