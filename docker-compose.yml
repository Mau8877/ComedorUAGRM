name: comedor-uagrm

services:
  # ---------------------------------------
  # REVERSE PROXY (El punto de entrada)
  # ---------------------------------------
  proxy:
    image: nginx:alpine
    container_name: comedor-uagrm-proxy
    # Defensa extra además de la resolución dinámica de nginx.conf: si de
    # todos modos llegara a morir (ej. el propio Docker Desktop matándolo a
    # mitad de un restart), que reintente solo en vez de quedar caído hasta
    # que alguien lo note a mano.
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - comedor-uagrm-network

  # ---------------------------------------
  # FRONTEND (React + Vite) - MODO DESARROLLO
  # ---------------------------------------
  frontend:
    image: node:22-alpine
    container_name: comedor-uagrm-frontend
    working_dir: /app/projects/frontend
    volumes:
      - .:/app
      # Ambos node_modules (raíz del workspace pnpm y el del paquete
      # frontend) tienen que estar aislados del bind mount de arriba -- si
      # no, pnpm dentro del contenedor escribe symlinks de Linux
      # directamente en tu filesystem de Windows apuntando a rutas que solo
      # existen DENTRO del contenedor (ej. /app/node_modules/.pnpm/...).
      # Esos symlinks quedan rotos para cualquier pnpm/tsc/ESLint que corras
      # en el host, y un pnpm install en el host los vuelve a pisar en
      # sentido contrario -- rompiendo lo del contenedor. Con volúmenes
      # nombrados, cada lado tiene su propio node_modules real y no chocan.
      - frontend_node_modules_root:/app/node_modules
      - frontend_node_modules_pkg:/app/projects/frontend/node_modules
    command: sh -c "corepack enable pnpm && pnpm install && pnpm run dev --host 0.0.0.0"
    ports:
      - '5173:5173'
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    networks:
      - comedor-uagrm-network

  # ---------------------------------------
  # BACKEND (Spring Boot 4.1 / Java 21) - MODO DESARROLLO
  # ---------------------------------------
  backend:
    image: maven:3.9-eclipse-temurin-21-alpine
    container_name: comedor-uagrm-backend
    working_dir: /app/projects/backend
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
      # Necesario para que Testcontainers (tests de integración, ver
      # TESTING_BACKEND.md) pueda levantar contenedores (ej. Postgres real)
      # desde DENTRO de este contenedor -- sin esto, `mvn test` falla con
      # "Could not find a valid Docker environment" en cualquier test que
      # use Testcontainers.
      - /var/run/docker.sock:/var/run/docker.sock
    command: mvn spring-boot:run -Dspring-boot.run.profiles=dev
    ports:
      - '8080:8080'
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      # Testcontainers necesita esto para hablar con el Docker Desktop de
      # Windows de forma confiable a través del socket montado -- sin esto,
      # su detección automática de estrategia de conexión falla en Windows
      # (ver TESTING_BACKEND.md).
      - DOCKER_HOST=unix:///var/run/docker.sock
      - TESTCONTAINERS_RYUK_DISABLED=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://comedor-uagrm-postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_DATA_REDIS_HOST=comedor-uagrm-redis
      - MINIO_URL=http://comedor-uagrm-minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - comedor-uagrm-network

  # ---------------------------------------
  # DATABASE (PostgreSQL 18)
  # ---------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: comedor-uagrm-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - '5432:5432'
    networks:
      - comedor-uagrm-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------
  # CACHE (Redis 8)
  # ---------------------------------------
  redis:
    image: redis:8-alpine
    container_name: comedor-uagrm-redis
    volumes:
      - redis_data:/data
      # Mapeamos tu archivo de configuración personalizado
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - '6379:6379'
    networks:
      - comedor-uagrm-network
    # Le decimos a Redis que arranque usando tu archivo
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------
  # STORAGE (MinIO)
  # ---------------------------------------
  minio:
    image: minio/minio
    container_name: comedor-uagrm-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    networks:
      - comedor-uagrm-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 20s
      retries: 3

  # Contenedor temporal para crear el bucket automáticamente
  minio-init:
    image: minio/mc
    container_name: comedor-uagrm-minio-init
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infrastructure/minio/create-buckets.sh:/create-buckets.sh:ro
    entrypoint: >
      /bin/sh -c "sh /create-buckets.sh"
    networks:
      - comedor-uagrm-network

  # ---------------------------------------
  # METRICS & OBSERVABILITY
  # ---------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: comedor-uagrm-prometheus
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    networks:
      - comedor-uagrm-network

  grafana:
    image: grafana/grafana:latest
    container_name: comedor-uagrm-grafana
    depends_on:
      - prometheus
    volumes:
      - ./infrastructure/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - '3000:3000'
    networks:
      - comedor-uagrm-network

# ---------------------------------------
# REDES Y VOLÚMENES
# ---------------------------------------
networks:
  comedor-uagrm-network:
    name: comedor-uagrm-network
    driver: bridge

volumes:
  postgres_data:
    name: comedor-uagrm-postgres_data
  redis_data:
    name: comedor-uagrm-redis_data
  minio_data:
    name: comedor-uagrm-minio_data
  frontend_node_modules_root:
    name: comedor-uagrm-frontend-node_modules-root
  frontend_node_modules_pkg:
    name: comedor-uagrm-frontend-node_modules-pkg
